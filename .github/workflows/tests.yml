name: tests

on:
  push:
  pull_request:

jobs:
  installer-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bsdiff4==1.2.6
      - run: python scripts/test_installer.py

